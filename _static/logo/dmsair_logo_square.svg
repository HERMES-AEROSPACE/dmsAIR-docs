<?xml version="1.0" encoding="UTF-8"?>
<!-- dmsAIR square / badge version
     Use as favicon, GitHub repo avatar, slide corner mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t d">
  <title id="t">dmsAIR</title>
  <desc id="d">Square dmsAIR badge: deep-blue rounded square, white bent triatomic molecule with amber-red central atom, stylised dmsAIR wordmark beneath.</desc>

  <!-- rounded square background -->
  <rect x="2" y="2" width="116" height="116" rx="22" ry="22" fill="#1f3b5a"/>

  <!-- molecule icon centred above the text -->
  <g transform="translate(60,52)" stroke-linecap="round">
    <line x1="-22" y1="12" x2="0"   y2="-16" stroke="#ffffff" stroke-width="4" fill="none"/>
    <line x1="0"   y1="-16" x2="22" y2="12"  stroke="#ffffff" stroke-width="4" fill="none"/>
    <circle cx="-22" cy="12"  r="9"  fill="#ffffff"/>
    <circle cx="0"   cy="-16" r="11" fill="#c92a2a"/>
    <circle cx="22"  cy="12"  r="9"  fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="60" y="100" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="20" letter-spacing="1">
    <tspan fill="#ffffff">dms</tspan><tspan fill="#c92a2a">AIR</tspan>
  </text>
</svg>
